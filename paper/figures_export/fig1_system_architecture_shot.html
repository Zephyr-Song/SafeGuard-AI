<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff;}
svg{display:block;width:2400px;height:991px;}</style></head>
<body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="920" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#1a1a2e">Figure 1. SafeBARS Multimodal Ethical Mirror — closed-loop architecture</text>
  <text x="20" y="50" font-size="11" fill="#666">Deployed at safebars-ai.pages.dev/safebars/mirror (Flask + pluggable LLM). The realization is the user's; the AI withholds the verdict.</text>

  <!-- pipeline boxes -->
  <g font-size="12" text-anchor="middle">
    <!-- input -->
    <rect x="20" y="110" width="120" height="56" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
    <text x="80" y="135" font-weight="600" fill="#1a1a2e">Researcher</text>
    <text x="80" y="152">design plan</text>

    <!-- engine -->
    <rect x="170" y="110" width="120" height="56" rx="8" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.5"/>
    <text x="230" y="132" font-weight="600" fill="#1a1a2e">Multi-role</text>
    <text x="230" y="148">ethics probes</text>
    <text x="230" y="162" font-size="10" fill="#666">(LLM)</text>

    <!-- deep-audit -->
    <rect x="320" y="110" width="120" height="56" rx="8" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.5"/>
    <text x="380" y="132" font-weight="600" fill="#1a1a2e">Deterministic</text>
    <text x="380" y="148">deep-audit</text>
    <text x="380" y="162" font-size="10" fill="#666">(offline)</text>

    <!-- multimodal 3 views -->
    <rect x="470" y="100" width="150" height="76" rx="8" fill="#fff4e5" stroke="#e08a1e" stroke-width="1.5"/>
    <text x="545" y="122" font-weight="700" fill="#1a1a2e">Multimodal layer</text>
    <text x="545" y="140" font-size="10.5">① Stakeholder map</text>
    <text x="545" y="154" font-size="10.5">② Value-conflict heatmap</text>
    <text x="545" y="168" font-size="10.5">③ Scenario branch tree</text>

    <!-- self-discovery (red highlight) -->
    <rect x="650" y="100" width="150" height="76" rx="8" fill="#fdecec" stroke="#d63b3b" stroke-width="2.5"/>
    <text x="725" y="122" font-weight="700" fill="#b00000">Self-discovery</text>
    <text x="725" y="140" font-size="10.5">"Did you anticipate</text>
    <text x="725" y="154" font-size="10.5">this group?" — ASKS,</text>
    <text x="725" y="168" font-size="10.5" font-weight="700" fill="#b00000">does NOT prescribe</text>

    <!-- co-revision -->
    <rect x="650" y="210" width="150" height="60" rx="8" fill="#eef0ff" stroke="#5b54d6" stroke-width="1.5"/>
    <text x="725" y="232" font-weight="700" fill="#1a1a2e">Co-revision</text>
    <text x="725" y="248" font-size="10.5">AI scaffold, not auto-fix</text>
    <text x="725" y="262" font-size="10.5">(user owns the edit)</text>

    <!-- arrows -->
    <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#a)">
      <line x1="140" y1="138" x2="168" y2="138"/>
      <line x1="290" y1="138" x2="318" y2="138"/>
      <line x1="440" y1="138" x2="468" y2="138"/>
      <line x1="620" y1="138" x2="648" y2="138"/>
      <line x1="725" y1="176" x2="725" y2="208"/>
    </g>

    <!-- feedback loop (before/after re-render) -->
    <path d="M650 240 C 540 320, 320 320, 200 168" stroke="#2e9e5b" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#b)"/>
    <text x="380" y="345" font-size="11" fill="#2e9e5b" font-weight="600" text-anchor="middle">before → after re-render (loop closes; change is visible &amp; owned)</text>
  </g>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2e9e5b"/></marker>
  </defs>
</svg>
</body></html>

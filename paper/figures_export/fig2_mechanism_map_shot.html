<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff;}
svg{display:block;width:2400px;height:1148px;}</style></head>
<body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="920" height="440" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#1a1a2e">Figure 2. Borrowing mechanisms from CHI'26 — inverting the rapport agenda</text>
  <text x="20" y="50" font-size="11" fill="#666">We reuse each paper's mechanism while reversing its goal: a critical-reflection tool must resist sycophancy and preserve critical distance.</text>

  <!-- Left: 5 CHI'26 papers -->
  <g font-size="11.5">
    <text x="20" y="78" font-size="12.5" font-weight="700" fill="#1a1a2e">CHI'26 anchors (goal: optimize rapport/liking)</text>
    <g>
      <rect x="20" y="90" width="270" height="60" rx="8" fill="#f3f4f8" stroke="#888" stroke-width="1"/>
      <text x="32" y="110" font-weight="700" fill="#333">Taheri (taheri26)</text>
      <text x="32" y="126" fill="#555">Mech: AI dialogue + critical friction</text>
      <text x="32" y="142" fill="#555">Self-reflection = serendipitous</text>

      <rect x="20" y="160" width="270" height="60" rx="8" fill="#f3f4f8" stroke="#888" stroke-width="1"/>
      <text x="32" y="180" font-weight="700" fill="#333">Perspectra (perspectra26)</text>
      <text x="32" y="196" fill="#555">Mech: user-selectable expert agents</text>
      <text x="32" y="212" fill="#555">Goal: enhance critical thinking</text>

      <rect x="20" y="230" width="270" height="60" rx="8" fill="#f3f4f8" stroke="#888" stroke-width="1"/>
      <text x="32" y="250" font-weight="700" fill="#333">RECALLbot (recallbot26)</text>
      <text x="32" y="266" fill="#555">Mech: agentic memory + reciprocal</text>
      <text x="32" y="282" fill="#555">disclosure → deeper relationship</text>

      <rect x="20" y="300" width="270" height="60" rx="8" fill="#f3f4f8" stroke="#888" stroke-width="1"/>
      <text x="32" y="320" font-weight="700" fill="#333">Hear You in Silence</text>
      <text x="32" y="336" fill="#555">Mech: context-aware pacing of</text>
      <text x="32" y="352" fill="#555">guidance (hearinsilence26)</text>

      <rect x="20" y="370" width="270" height="56" rx="8" fill="#f3f4f8" stroke="#888" stroke-width="1"/>
      <text x="32" y="390" font-weight="700" fill="#333">Vibe Check (vibecheck26)</text>
      <text x="32" y="406" fill="#555">Mech: personality/alignment tuning</text>
      <text x="32" y="420" fill="#555">Goal: maximize felt agreement</text>
    </g>
  </g>

  <!-- Middle arrow -->
  <g>
    <rect x="320" y="200" width="150" height="60" rx="10" fill="#1a1a2e"/>
    <text x="395" y="226" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">BORROW</text>
    <text x="395" y="244" font-size="12.5" font-weight="700" fill="#ffd24d" text-anchor="middle">+ INVERT</text>
    <g stroke="#1a1a2e" stroke-width="2" fill="none" marker-end="url(#m)">
      <line x1="292" y1="120" x2="318" y2="218"/>
      <line x1="292" y1="190" x2="318" y2="218"/>
      <line x1="292" y1="260" x2="318" y2="232"/>
      <line x1="292" y1="330" x2="318" y2="244"/>
      <line x1="292" y1="398" x2="318" y2="248"/>
    </g>
    <line x1="470" y1="230" x2="560" y2="230" stroke="#1a1a2e" stroke-width="2" marker-end="url(#m)"/>
  </g>

  <!-- Right: our refinements -->
  <g font-size="11.5">
    <text x="575" y="78" font-size="12.5" font-weight="700" fill="#1a1a2e">SafeBARS refinements (goal: critical distance)</text>
    <g>
      <rect x="575" y="90" width="320" height="58" rx="8" fill="#eef6ff" stroke="#3b6fd4" stroke-width="1.5"/>
      <text x="588" y="110" font-weight="700" fill="#1a3a8a">① User-selectable experts</text>
      <text x="588" y="126" fill="#555">invite the lenses/roles to be challenged by</text>
      <text x="588" y="142" font-size="10.5" fill="#888">← Perspectra</text>

      <rect x="575" y="158" width="320" height="58" rx="8" fill="#eef6ff" stroke="#3b6fd4" stroke-width="1.5"/>
      <text x="588" y="178" font-weight="700" fill="#1a3a8a">② Agentic memory + reciprocal disclosure</text>
      <text x="588" y="194" fill="#555">recall prior commitments; state AI's limits</text>
      <text x="588" y="210" font-size="10.5" fill="#888">← RECALLbot</text>

      <rect x="575" y="226" width="320" height="58" rx="8" fill="#eef6ff" stroke="#3b6fd4" stroke-width="1.5"/>
      <text x="588" y="246" font-weight="700" fill="#1a3a8a">③ Context-aware pacing</text>
      <text x="588" y="262" fill="#555">pause after a self-discovery moment;</text>
      <text x="588" y="278" font-size="10.5" fill="#888">batch tensions by cognitive load ← Hear You in Silence</text>

      <rect x="575" y="294" width="320" height="58" rx="8" fill="#fdecec" stroke="#d63b3b" stroke-width="2"/>
      <text x="588" y="314" font-weight="700" fill="#b00000">④ Alignment manipulation (RQ6)</text>
      <text x="588" y="330" fill="#555">critical/non-sycophantic vs sycophantic</text>
      <text x="588" y="346" font-size="10.5" fill="#888">← Vibe Check (goal inverted)</text>

      <rect x="575" y="362" width="320" height="50" rx="8" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.5"/>
      <text x="588" y="382" font-weight="700" fill="#1a6b3a">⑤ Critical friction, designed (RQ2)</text>
      <text x="588" y="398" fill="#555">ask, don't tell — realization owned by user</text>
      <text x="588" y="412" font-size="10.5" fill="#888">← Taheri (mechanism made deliberate)</text>
    </g>
  </g>

  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a1a2e"/></marker>
  </defs>
</svg>
</body></html>
